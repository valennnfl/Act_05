<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luné || Carrito con Vue</title>
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--Bootstrap iconos-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!--CSS-->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
    <nav class="navbar">
    <div class="nav-contenedor">

        <!-- Lado Izquierdo -->
        <div class="nav-izquierda">
            <a href="/" class="nav-link">Inicio</a>
        </div>

        <!-- Centro (Logo) -->
        <a href="/" class="navbar-brand">
            <img src="img/logo.png" alt="Logo de Luné" class="logo">
        </a>

        <div class="nav-derecha">
            <a href="#seccion-productos" class="nav-link">Productos</a>
            
            <div class="ir-carrito">
                <a href="modal fade" class="nav-link" data-bs-toggle="modal" data-bs-target="#carritoModal">
                    <i class="bi bi-cart3"></i> Carrito
                </a>
            </div>
        </div>

    </div>
        </nav>

    </header>
    <div id="app">

        <main id="inicio">
        
            <section id="seccion-productos" class="productos">
            <h2>Productos</h2>
        
            <!-- Barra de busqueda + filtro -->
            <div class="barra-herramientas">
                <!-- Buscador integrado al lado -->
                <div class="grupo-buscador">
                    <input
                        type="text"
                        id="busqueda"
                        v-model="busqueda"
                        placeholder="Buscar producto..."
                        class="input-busqueda"
                    >
                    <i class="bi bi-search icono-buscar"></i> 
                </div>
                
                <div class="grupo-filtros">
                    <button 
                        v-for="cat in ['Todas', 'Ropa', 'Maquillaje', 'Cuidados', 'Joyeria']" 
                        :key="cat"
                        @click="categoriaSeleccionada = cat"
                        :class="['btn-filtro', { 'activo': categoriaSeleccionada === cat }]"
                    >
                        {{ cat }}
                    </button>
                </div>
        
        
            </div>
        
            <div class="contenedor-productos">
                <producto-card
                    v-for="producto in productosFiltrados"
                    :key="producto.id"
                    :producto="producto"
                    @agregar="agregarAlCarrito"
                ></producto-card>
            </div>
            </section>
        </main>
    
    
        <!-- 🛒 MODAL DEL CARRITO -->
        <div class="modal fade" id="carritoModal" tabindex="-1" aria-labelledby="carritoModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-md"> <!-- Centrado en pantalla -->
                <div class="modal-content modal-carrito-lune">
                    
                    <!-- Cabecera del Modal -->
                    <div class="modal-header border-0">
                        <h5 class="modal-title" id="carritoModalLabel">Tu Carrito 🌸</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
        
                    <!-- Cuerpo del Modal-->
                    <div class="modal-body contenedor-items-carrito">
                        <!-- componente Carrito de Vue -->
                        <carrito
                            :carrito="carrito"
                            :total="total"
                            @eliminar="eliminarDelCarrito"
                            @vaciar="vaciarCarrito"
                        ></carrito>
                    </div>
        
                </div>
            </div>
        </div>
    </div>
    

    <footer class="footer-lune">
        <div class="container">
            <div class="row align-items-center gy-4">

                <!-- Logo y descripción -->
                <div class="col-md-6 text-center text-md-start">
                    <img
                        src="img/logo_version2.png"
                        alt="Luné"
                        class="footer-logo"
                    >
                </div>

                <!-- Navegación -->
                <div class="col-md-6 text-center">
                    <h5>Explorá Luné</h5>

                    <div class="footer-links">
                        <a href="#">Inicio</a>
                        <a href="#">Productos</a>
                    </div>
                </div>
            </div>

            <hr>

            <div class="footer-bottom text-center">
                <p>
                    © 2026 Luné · Proyecto académico — Escuela Da Vinci
                </p>
            </div>
        </div>
    </footer>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!--vue-->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script src="componentes/ProductoCard.js"></script>
    <script src="componentes/CarritoItem.js"></script>
    <script src="componentes/Carrito.js"></script>
    <!--Script global-->
    <script src="app.js"></script>
    <!--Script componentes-->

</body>
</html>
